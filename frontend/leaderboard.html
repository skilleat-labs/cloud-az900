<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AZ-900 모의고사 - 리더보드</title>
  <style>
    :root {
      --bg-primary: #0f1923;
      --bg-secondary: #1B2A4A;
      --azure-blue: #0078D4;
      --azure-light: #50e6ff;
      --text-primary: #e8f4fd;
      --text-secondary: #a8c4d8;
      --text-muted: #6b8fa8;
      --border: #2a4a6b;
      --gold: #FFD700;
      --silver: #C0C0C0;
      --bronze: #CD7F32;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 120, 212, 0.15);
      --transition: all 0.3s ease;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans KR', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
    }

    /* ── Top Bar ── */
    .top-bar {
      background: var(--bg-secondary);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 60px;
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .back-btn {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: var(--transition);
      white-space: nowrap;
    }
    .back-btn:hover { color: var(--text-primary); }

    /* ── Page Nav Toggle ── */
    .page-nav {
      display: flex;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .page-nav-btn {
      padding: 7px 18px;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: var(--transition);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .page-nav-btn.active {
      background: var(--azure-blue);
      color: white;
    }
    .page-nav-btn:not(.active):hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.05);
    }

    .spacer { flex: 1; }

    .refresh-info {
      font-size: 12px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 28px 16px;
    }

    /* ── Exam Selector Dropdown ── */
    .exam-selector {
      max-width: 960px;
      margin: 20px auto 0;
      padding: 0 20px;
      position: relative;
    }

    .exam-dropdown-btn {
      width: 100%;
      padding: 12px 18px;
      background: var(--bg-secondary);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      transition: var(--transition);
      text-align: left;
    }
    .exam-dropdown-btn:hover,
    .exam-dropdown-btn.open {
      border-color: var(--azure-blue);
    }
    .exam-dropdown-btn .btn-label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .exam-dropdown-btn .btn-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .exam-dropdown-btn .exam-count {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 400;
    }
    .exam-dropdown-btn .chevron-icon {
      color: var(--text-muted);
      transition: transform 0.25s;
    }
    .exam-dropdown-btn.open .chevron-icon {
      transform: rotate(180deg);
    }

    .exam-dropdown-list {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 20px;
      right: 20px;
      background: var(--bg-secondary);
      border: 1.5px solid var(--azure-blue);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.4);
      z-index: 100;
      max-height: 360px;
      overflow-y: auto;
    }
    .exam-dropdown-list.open {
      display: block;
    }
    .exam-option {
      padding: 12px 18px;
      cursor: pointer;
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid rgba(42,74,107,0.5);
      transition: var(--transition);
    }
    .exam-option:last-child { border-bottom: none; }
    .exam-option:hover {
      background: rgba(0,120,212,0.1);
      color: var(--text-primary);
    }
    .exam-option.active {
      background: rgba(0,120,212,0.15);
      color: var(--azure-light);
      font-weight: 600;
    }
    .exam-option .opt-title { flex: 1; }
    .exam-option .opt-check {
      color: var(--azure-light);
      font-size: 16px;
      opacity: 0;
    }
    .exam-option.active .opt-check { opacity: 1; }

    /* ── Leaderboard Table ── */
    .lb-container {
      background: var(--bg-secondary);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .lb-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .lb-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-secondary);
    }

    .lb-count {
      font-size: 13px;
      color: var(--text-muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    thead tr {
      background: rgba(0, 0, 0, 0.2);
    }

    th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      border-bottom: 1px solid var(--border);
    }

    th.right { text-align: right; }
    th.center { text-align: center; }

    tbody tr {
      transition: var(--transition);
      border-bottom: 1px solid rgba(42, 74, 107, 0.5);
    }

    tbody tr:last-child { border-bottom: none; }

    tbody tr:hover {
      background: rgba(0, 120, 212, 0.05);
    }

    tbody tr.rank-1 { background: rgba(255, 215, 0, 0.06); }
    tbody tr.rank-2 { background: rgba(192, 192, 192, 0.05); }
    tbody tr.rank-3 { background: rgba(205, 127, 50, 0.05); }

    td {
      padding: 14px 16px;
      font-size: 14px;
      color: var(--text-secondary);
    }

    td.center { text-align: center; }
    td.right { text-align: right; }

    .rank-cell {
      font-weight: 800;
      font-size: 16px;
      width: 50px;
      text-align: center;
    }

    .rank-medal { font-size: 20px; }

    .name-cell {
      font-weight: 600;
      color: var(--text-primary);
    }

    .score-cell {
      font-weight: 700;
      color: var(--text-primary);
      font-size: 15px;
    }

    .pct-cell { font-weight: 600; }

    .pct-bar-wrap {
      width: 80px;
      height: 6px;
      background: var(--border);
      border-radius: 3px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
      margin-right: 8px;
    }

    .pct-bar {
      height: 100%;
      border-radius: 3px;
      background: linear-gradient(90deg, #0078D4, #50e6ff);
    }

    .time-cell {
      font-variant-numeric: tabular-nums;
      color: var(--text-muted);
    }

    .date-cell {
      color: var(--text-muted);
      font-size: 12px;
    }

    /* ── Empty / Loading ── */
    .empty-state {
      padding: 60px 24px;
      text-align: center;
      color: var(--text-muted);
    }

    .empty-icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state p { font-size: 15px; margin-bottom: 8px; }
    .empty-state small { font-size: 13px; }

    .loading-state {
      padding: 60px 24px;
      text-align: center;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--azure-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .refresh-dot {
      width: 8px;
      height: 8px;
      background: var(--azure-light);
      border-radius: 50%;
      display: inline-block;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    @media (max-width: 600px) {
      .page-nav-btn { padding: 7px 12px; font-size: 12px; }
      th.hide-sm, td.hide-sm { display: none; }
      td { padding: 12px 10px; }
    }
  </style>
</head>
<body>

<div class="top-bar">
  <a href="index.html" class="back-btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
    홈
  </a>

  <div class="page-nav">
    <span class="page-nav-btn active">
      🏆 리더보드
    </span>
    <a id="adminLink" href="admin.html" class="page-nav-btn">
      📊 오답 분석
    </a>
  </div>

  <div class="spacer"></div>

  <div class="refresh-info">
    <span class="refresh-dot"></span>
    <span id="refreshCounter" style="margin-left:2px;">30s</span>
  </div>
</div>

<!-- Exam Selector -->
<div class="exam-selector">
  <button class="exam-dropdown-btn" id="examDropdownBtn" onclick="toggleDropdown()">
    <span class="btn-label" id="examBtnLabel">로딩 중...</span>
    <span class="btn-right">
      <span class="exam-count" id="examBtnCount"></span>
      <svg class="chevron-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </span>
  </button>
  <div class="exam-dropdown-list" id="examDropdownList"></div>
</div>

<div class="container">
  <div class="lb-container" id="lbContainer">
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color: var(--text-muted);">데이터 불러오는 중...</p>
    </div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(location.search);
let exams = [];
let currentExamId = urlParams.get('exam_id') || '';
let countdown = 30;
let countdownInterval = null;

async function loadExams() {
  try {
    const res = await fetch('/api/exams');
    exams = await res.json();
    renderExamDropdown();

    if (!currentExamId && exams.length > 0) {
      currentExamId = exams[0].id;
    }

    if (currentExamId) {
      renderExamDropdown();
      updateAdminLink();
      loadLeaderboard(currentExamId);
      startRefreshTimer();
    }
  } catch (e) {
    document.getElementById('examBtnLabel').textContent = '시험 목록 로드 실패';
  }
}

function updateAdminLink() {
  const link = document.getElementById('adminLink');
  if (currentExamId) {
    link.href = `admin.html?exam_id=${encodeURIComponent(currentExamId)}`;
  }
}

function renderExamDropdown() {
  const btn = document.getElementById('examDropdownBtn');
  const list = document.getElementById('examDropdownList');
  const label = document.getElementById('examBtnLabel');
  const countEl = document.getElementById('examBtnCount');

  const current = exams.find(e => e.id === currentExamId);
  label.textContent = current ? current.title : '시험지 선택';
  countEl.textContent = `${exams.length}개`;

  list.innerHTML = exams.map(exam => `
    <div class="exam-option ${exam.id === currentExamId ? 'active' : ''}"
         onclick="selectExam('${exam.id}')">
      <span class="opt-title">${exam.title}</span>
      <span class="opt-check">✓</span>
    </div>
  `).join('');
}

function toggleDropdown() {
  const btn = document.getElementById('examDropdownBtn');
  const list = document.getElementById('examDropdownList');
  const isOpen = list.classList.contains('open');
  if (isOpen) {
    btn.classList.remove('open');
    list.classList.remove('open');
  } else {
    btn.classList.add('open');
    list.classList.add('open');
  }
}

function closeDropdown() {
  document.getElementById('examDropdownBtn').classList.remove('open');
  document.getElementById('examDropdownList').classList.remove('open');
}

function selectExam(examId) {
  currentExamId = examId;
  closeDropdown();
  renderExamDropdown();
  updateAdminLink();
  history.replaceState(null, '', `?exam_id=${encodeURIComponent(examId)}`);
  loadLeaderboard(examId);
  resetCountdown();
}

document.addEventListener('click', function(e) {
  const selector = document.querySelector('.exam-selector');
  if (selector && !selector.contains(e.target)) {
    closeDropdown();
  }
});

async function loadLeaderboard(examId) {
  const container = document.getElementById('lbContainer');
  container.innerHTML = `
    <div class="loading-state">
      <div class="spinner"></div>
      <p style="color: var(--text-muted);">데이터 불러오는 중...</p>
    </div>`;

  try {
    const res = await fetch(`/api/leaderboard?exam_id=${encodeURIComponent(examId)}`);
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    renderLeaderboard(data, examId);
  } catch (e) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">⚠️</div>
        <p>데이터를 불러오지 못했습니다.</p>
      </div>`;
  }
}

function renderLeaderboard(data, examId) {
  const exam = exams.find(e => e.id === examId);
  const container = document.getElementById('lbContainer');

  if (data.length === 0) {
    container.innerHTML = `
      <div class="lb-header">
        <span class="lb-title">${exam ? exam.title : examId}</span>
      </div>
      <div class="empty-state">
        <div class="empty-icon">📋</div>
        <p>아직 기록이 없습니다.</p>
        <small>첫 번째로 시험을 완료하세요!</small>
      </div>`;
    return;
  }

  const medals = ['🥇', '🥈', '🥉'];

  const rows = data.map((entry) => {
    const rankNum = entry.rank;
    const rankClass = rankNum <= 3 ? `rank-${rankNum}` : '';
    const medalOrNum = rankNum <= 3
      ? `<span class="rank-medal">${medals[rankNum - 1]}</span>`
      : `<span style="color: var(--text-muted);">${rankNum}</span>`;

    const pctColor = entry.percentage >= 90 ? '#00c853' : entry.percentage >= 70 ? '#ffd166' : '#ff4444';
    const timeStr = formatTime(entry.time_seconds);
    const dateStr = formatDate(entry.finished_at);

    return `
      <tr class="${rankClass}">
        <td class="rank-cell">${medalOrNum}</td>
        <td class="name-cell">${escapeHtml(entry.user_name)}</td>
        <td class="score-cell">${entry.score} <span style="color:var(--text-muted);font-size:12px;font-weight:400;">/ ${entry.total}</span></td>
        <td class="pct-cell" style="color: ${pctColor};">
          <div class="pct-bar-wrap"><div class="pct-bar" style="width: ${entry.percentage}%; background: ${pctColor};"></div></div>
          ${entry.percentage}%
        </td>
        <td class="time-cell hide-sm">${timeStr}</td>
        <td class="date-cell hide-sm">${dateStr}</td>
      </tr>
    `;
  }).join('');

  container.innerHTML = `
    <div class="lb-header">
      <span class="lb-title">${exam ? exam.title : examId}</span>
      <span class="lb-count">Top ${data.length}</span>
    </div>
    <table>
      <thead>
        <tr>
          <th class="center">순위</th>
          <th>이름</th>
          <th>점수</th>
          <th>정답률</th>
          <th class="hide-sm">소요시간</th>
          <th class="hide-sm">날짜</th>
        </tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

function startRefreshTimer() {
  countdown = 30;
  countdownInterval = setInterval(() => {
    countdown--;
    document.getElementById('refreshCounter').textContent = `${countdown}s`;
    if (countdown <= 0) {
      countdown = 30;
      if (currentExamId) loadLeaderboard(currentExamId);
    }
  }, 1000);
}

function resetCountdown() {
  countdown = 30;
  document.getElementById('refreshCounter').textContent = `${countdown}s`;
}

function formatTime(seconds) {
  if (!seconds && seconds !== 0) return '-';
  const m = Math.floor(seconds / 60);
  const s = seconds % 60;
  return `${m}:${String(s).padStart(2, '0')}`;
}

function formatDate(isoStr) {
  if (!isoStr) return '-';
  const d = new Date(isoStr);
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
}

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

loadExams();
</script>
</body>
</html>
